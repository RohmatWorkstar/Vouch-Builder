<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vouch Night-Shift Handover</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f9f9f9;
        }
        .container {
            background-color: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            border-bottom: 2px solid #eaeaea;
            padding-bottom: 10px;
        }
        .loader {
            display: none;
            margin: 20px 0;
            font-style: italic;
            color: #666;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        #report {
            margin-top: 30px;
        }
        .meta-info {
            background-color: #eef;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Night-Shift Handover Generator</h1>
        <p>Click the button below to generate the handover report for the morning of Saturday, 30 May 2026.</p>
        
        <button id="generateBtn" onclick="generateReport()">Generate Handover</button>
        <div id="loader" class="loader">Generating report... (This may take 10-20 seconds)</div>
        
        <div id="meta" style="display:none;" class="meta-info"></div>
        <div id="report"></div>
    </div>

    <script>
        async function generateReport() {
            const btn = document.getElementById('generateBtn');
            const loader = document.getElementById('loader');
            const reportDiv = document.getElementById('report');
            const metaDiv = document.getElementById('meta');

            btn.disabled = true;
            loader.style.display = 'block';
            reportDiv.innerHTML = '';
            metaDiv.style.display = 'none';

            try {
                const response = await fetch('/api/handover?date=2026-05-30');
                const data = await response.json();

                if (data.success) {
                    metaDiv.innerHTML = `
                        <strong>Target Date:</strong> ${data.targetDate} <br>
                        <strong>Total Events Processed:</strong> ${data.meta.totalEventsProcessed} <br>
                        <strong>Threads:</strong> ${data.meta.threads.newTonight} New Tonight, ${data.meta.threads.newlyResolved} Newly Resolved, ${data.meta.threads.stillOpen} Still Open
                    `;
                    metaDiv.style.display = 'block';
                    reportDiv.innerHTML = marked.parse(data.report);
                } else {
                    reportDiv.innerHTML = `<p style="color: red;">Error: ${data.error}</p>`;
                }
            } catch (error) {
                reportDiv.innerHTML = `<p style="color: red;">Failed to fetch: ${error.message}</p>`;
            } finally {
                btn.disabled = false;
                loader.style.display = 'none';
            }
        }
    </script>
</body>
</html>
